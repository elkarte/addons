{% case cat %}
	{% when 'admin' %}
	<i class="bi bi-shield-check text-primary" aria-hidden="true"></i>
	{% when 'utility' %}
	<i class="bi bi-wrench text-primary" aria-hidden="true"></i>
	{% when 'security' %}
	<i class="bi bi-eye text-primary" aria-hidden="true"></i>
	{% when 'enhancement' %}
	<i class="bi bi-bell text-primary" aria-hidden="true"></i>
	{% when 'feature' %}
	<i class="bi bi-leaf text-primary" aria-hidden="true"></i>
	{% when 'smiley' %}
	<i class="bi bi-heart text-primary" aria-hidden="true"></i>
	{% when 'bbc' %}
	<i class="bi bi-pencil-square text-primary" aria-hidden="true"></i>
	{% when 'avatar' %}
	<i class="bi bi-person text-primary" aria-hidden="true"></i>
	{% else %}
	<i class="bi bi-shuffle text-primary" aria-hidden="true"></i>
{% endcase %}
